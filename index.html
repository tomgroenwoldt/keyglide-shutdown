<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>keygli.de — Shut Down</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 500;
      color: #e8e8e8;
      letter-spacing: -0.5px;
      margin-bottom: 0.75rem;
    }

    .tagline {
      font-size: 16px;
      color: #777;
      max-width: 380px;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #2a2a2a;
      margin: 0 auto 1.5rem;
    }

    .message {
      font-size: 15px;
      color: #888;
      max-width: 420px;
      line-height: 1.85;
      margin-bottom: 2rem;
    }

    .date {
      display: inline-block;
      font-size: 12px;
      font-family: "SF Mono", "Fira Code", "Courier New", monospace;
      color: #555;
      border: 1px solid #222;
      border-radius: 20px;
      padding: 5px 16px;
      margin-bottom: 2rem;
    }

    .repo-link a {
      font-size: 13px;
      color: #555;
      text-decoration: none;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 1px;
      transition: color 0.15s, border-color 0.15s;
    }

    .repo-link a:hover {
      color: #999;
      border-color: #555;
    }
  </style>
</head>
<body>
  <h1>keygli.de has shut down</h1>
  <p class="tagline">Thank you to everyone who used this project. It meant a lot.</p>
  <div class="divider"></div>
  <p class="message">
    This service is no longer available. If you had any data here,
    it has been deleted as part of the shutdown. Thank you for being part of this.
  </p>
  <span class="date">Closed · May 2026</span>
  <p class="repo-link"><a href="https://github.com/tomgroenwoldt/keyglide-shutdown">github.com/tomgroenwoldt/keyglide-shutdown</a></p>
</body>
</html>
